name: Daily brief

# Claude writes each morning's edition and pushes it here; every push republishes the site.
# To have GitHub's own free bot write editions instead, add back:
#   schedule:
#     - cron: "33 5 * * *"   # 06:33 Madrid in winter
on:
  workflow_dispatch: {}   # "Run workflow" button: writes a headlines-only edition with the free bot
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot
        if: github.event_name != 'push'
        run: pip install -r bot/requirements.txt

      - name: Write today's edition
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python bot/update.py

      - name: Save the edition to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "hemicycle-bot"
          git config user.email "hemicycle-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Edition $(TZ=Europe/Madrid date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
